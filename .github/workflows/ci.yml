name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Tests & Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up FFmpeg
        shell: pwsh
        run: |
          # FedericoCarboni/setup-ffmpeg@v3 fails on unauthenticated API limits
          # ("Cannot get latest release"). Use the runner's FFmpeg if present,
          # otherwise install it with the package manager that ships on Windows.
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          ffmpeg -version | Select-Object -First 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest httpx

      - name: Run Pytest test suite
        run: |
          python -m pytest tests -v --tb=short 2>&1 | Out-File -FilePath pytest_log.txt -Encoding utf8
          $code = $LASTEXITCODE
          Get-Content pytest_log.txt
          $failed = Select-String -Path pytest_log.txt -Pattern "^FAILED |^ERROR "
          if ($failed) {
            "### Pytest failures" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $failed | ForEach-Object { $_.Line } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            # Annotations are readable on the public run page without auth; the
            # uploaded log and the step summary both need a token.
            $failed | ForEach-Object { Write-Output "::error title=Pytest failure::$($_.Line)" }
          }
          if ($code -ne 0) { exit 1 }

      - name: Upload Pytest Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_log.txt

      - name: Run JavaScript safe-zone tests
        run: |
          node tests/js/safe_zone_test.js
