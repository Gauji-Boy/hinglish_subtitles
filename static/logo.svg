<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Outer Shadow -->
  <rect x="4" y="4" width="26" height="26" rx="4" fill="#000000" />
  <!-- Main Yellow Face -->
  <rect x="2" y="2" width="26" height="26" rx="4" fill="#facc15" stroke="#000000" stroke-width="2" />
  <!-- Inner Dark Screen -->
  <rect x="5" y="6" width="20" height="18" rx="2" fill="#0c0d10" stroke="#000000" stroke-width="1.5" />
  <!-- Soundwave / Subtitle CC Bars -->
  <!-- Line 1: White bar -->
  <rect x="8" y="10" width="14" height="2.5" rx="1" fill="#ffffff" />
  <!-- Line 2: Cyan code bar -->
  <rect x="8" y="15" width="9" height="2.5" rx="1" fill="#38bdf8" />
  <!-- Line 2: Small dot / blink -->
  <circle cx="19.5" cy="16.25" r="1.25" fill="#f43f5e" />
</svg>
