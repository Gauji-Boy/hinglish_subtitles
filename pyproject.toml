[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-subtitles"
version = "1.0.0"
description = "Conversational Hinglish ASR subtitle generator with synchronized kinetic karaoke, 2026 short-form safe zones, and local hardware-accelerated video burning."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Gauji-Boy", email = "sushanthcs2004@gmail.com" }
]
keywords = [
    "hinglish",
    "subtitles",
    "whisper",
    "faster-whisper",
    "speech-to-text",
    "asr",
    "karaoke",
    "reels",
    "shorts",
    "safe-zones",
    "video-editing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "pywebview>=5.0.0",
    "faster-whisper>=1.0.0",
    "aksharamukha>=2.0.0",
    "numpy>=1.24.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "cmudict>=1.0.0",
    "wordfreq>=3.0.0",
    "yt-dlp>=2024.0.0",
    # Kinetic line wrapping measures with real font metrics (karaoke_ass.py).
    # Without Pillow it falls back to a character-count estimate and burns
    # different line breaks than the machine that previewed the style.
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Gauji-Boy/hinglish_subtitles"
Documentation = "https://github.com/Gauji-Boy/hinglish_subtitles#readme"
Repository = "https://github.com/Gauji-Boy/hinglish_subtitles.git"
Issues = "https://github.com/Gauji-Boy/hinglish_subtitles/issues"

[project.scripts]
hinglish-subtitles = "hinglish_subtitles.server:main"

[tool.setuptools]
packages = ["hinglish_subtitles"]
package-dir = {"hinglish_subtitles" = "."}
include-package-data = true

[tool.setuptools.package-data]
hinglish_subtitles = [
    "static/**/*",
    "app_icon.ico",
    "launch_config.json"
]
